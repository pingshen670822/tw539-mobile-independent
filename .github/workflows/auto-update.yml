name: 開獎後全自動更新與手機同步
on:
  push:
    branches: [master]
    paths:
      - 'cloud_pipeline.py'
      - 'ironlaw_guard.py'
      - 'report_pages.py'
      - 'system_audit.py'
      - 'tw539_ultra.py'
      - 'watchdog.py'
      - 'draw_sentinel.py'
      - 'site/mobile-sync.js'
      - 'site/service-worker.js'
      - '.github/workflows/auto-update.yml'
      - '.github/workflows/watchdog.yml'
      - '.github/workflows/draw-sentinel.yml'
  schedule:
    # 鐵律：台灣時間週一至週六 20:27～23:57 每5分鐘先做輕量期別比對。
    # 改用非整點熱門分鐘，降低雲端排程擁塞與佚列丟棄。
    # 公開頁已同版立即結束；只有官方期別變動才啟動完整重算與部署。
    - cron: '27,32,37,42,47,52,57 12 * * 1-6'
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 13-15 * * 1-6'
  workflow_dispatch:
    inputs:
      repair:
        description: 自主修復重跑
        required: false
        default: false
        type: boolean
permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
concurrency:
  group: tw539-auto-update
  # 五分鐘排程不得取消正在完成的正式重算；卡住工作由三十分鐘硬逾時與看門狗接管。
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - name: 同步遠端最新基底
        timeout-minutes: 2
        run: |
          git fetch origin master
          git checkout -B master origin/master
          git branch --set-upstream-to=origin/master master
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: 排程同版快速結束
        id: schedule_gate
        if: github.event_name == 'schedule'
        continue-on-error: true
        timeout-minutes: 2
        env:
          TW539_WATCHDOG_FAST: 1
        run: |
          if python watchdog.py; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "官方與公開頁同版，本輪不重算、不重部署"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "偵測到新期別或公開頁落後，立即完整重算"
          fi
      - name: 鐵律完整性檢查
        if: steps.schedule_gate.outputs.current != 'true'
        run: python ironlaw_guard.py --structure-only
      - name: 取得官方開獎並重算
        if: steps.schedule_gate.outputs.current != 'true'
        timeout-minutes: 18
        env:
          TW539_SELF_REPAIR: ${{ inputs.repair || false }}
        run: |
          if [ "$TW539_SELF_REPAIR" = "true" ] && python cloud_pipeline.py --verify-only --strict-freshness; then
            echo "本地資料完整，立即略過重算並重新部署"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if python cloud_pipeline.py --strict-freshness; then
              exit 0
            fi
            echo "第 ${attempt} 次主流程失敗，清除暫存後重試"
            rm -f data/539.csv.tmp
            sleep $((attempt * 10))
          done
          exit 1
      - name: 發布核心驗收
        if: steps.schedule_gate.outputs.current != 'true'
        timeout-minutes: 3
        run: python cloud_pipeline.py --verify-only --strict-freshness
      - name: 保存最新資料與戰報
        if: steps.schedule_gate.outputs.current != 'true'
        timeout-minutes: 5
        run: |
          git config user.name "tw539-auto-update"
          git config user.email "actions@users.noreply.github.com"
          git add data reports site
          git diff --cached --quiet || git commit -m "開獎後自動更新"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            git rebase --abort || true
            git fetch origin master
            if git rebase -X theirs origin/master; then
              sleep $((attempt * 5))
              continue
            fi
            git rebase --abort || true
            sleep $((attempt * 10))
          done
          exit 1
      - uses: actions/configure-pages@v6
        if: steps.schedule_gate.outputs.current != 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.schedule_gate.outputs.current != 'true'
        with: {path: site}
      - uses: actions/deploy-pages@v5
        if: steps.schedule_gate.outputs.current != 'true'

      - name: 鐵律最終驗證
        if: steps.schedule_gate.outputs.current != 'true'
        run: python cloud_pipeline.py --verify-only --strict-freshness

      - name: 部署後深度模型與版面診斷
        if: steps.schedule_gate.outputs.current != 'true'
        timeout-minutes: 8
        id: deep_audit
        continue-on-error: true
        run: |
          python ironlaw_guard.py
          python system_audit.py

      - name: 深度診斷異常記錄
        if: steps.schedule_gate.outputs.current != 'true' && steps.deep_audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" --title "診斷告警：預測已正常發布但深度檢查需修復 ${{ github.run_id }}" --body "核心資料、預測與手機頁已成功更新；非阻斷深度診斷發現異常，下一輪自主修復會繼續重算。${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true

  alert:
    needs: update
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 建立自動更新失敗告警
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "${{ github.repository }}" --title "鐵律告警：539自動更新失敗 ${{ github.run_id }}" --body "自動更新、資料新鮮度或部署失敗。請立即檢查：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
  
