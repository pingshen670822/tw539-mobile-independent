name: 手機雲端資料鐵律看門狗
on:
  workflow_run:
    workflows: [開獎後全自動更新與手機同步]
    types: [completed]
  schedule:
    # 台灣時間20:30至隔日00:55每5分鐘輕量巡檢；落後即觸發完整自修。
    # 加密觸發可降低雲端排程偶發延遲造成兩小時期限失守的風險。
    - cron: '30,35,40,45,50,55 12 * * 1-6'
    - cron: '*/5 13-16 * * 1-6'
    - cron: '0 23 * * 1-6'
    # 全天每小時獨立巡檢；即使主排程沒有啟動，也能偵測公開頁與官方期別差異。
    - cron: '17 * * * *'
  workflow_dispatch: {}
permissions:
  contents: read
  actions: write
  issues: write
jobs:
  verify-and-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: tw539-watchdog
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: 立即比較官方與手機公開頁
        id: fast_check
        continue-on-error: true
        timeout-minutes: 4
        env:
          TW539_WATCHDOG_FAST: 1
        run: python watchdog.py
      - name: 完整穩定性巡檢
        id: full_check
        if: steps.fast_check.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 4
        run: python watchdog.py
      - name: 落後時自動重跑主流程
        if: steps.fast_check.outcome == 'failure' || steps.full_check.outcome == 'failure'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            gh workflow run auto-update.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" -f repair=true && exit 0
            sleep $((attempt * 3))
          done
          exit 1
      - name: 修復後再次驗證
        if: steps.fast_check.outcome == 'failure' || steps.full_check.outcome == 'failure'
        timeout-minutes: 17
        run: |
          for i in {1..40}; do
            python watchdog.py && exit 0
            sleep 20
          done
          exit 1
      - name: 修復失敗建立告警
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "${{ github.repository }}" --title "鐵律告警：手機公開頁仍落後官方 ${{ github.run_id }}" --body "看門狗自動重跑後仍未同步。請立即檢查：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
