name: 手機雲端資料鐵律看門狗
on:
  workflow_run:
    workflows: [開獎後全自動更新與手機同步]
    types: [completed]
  schedule:
    # 台灣時間20:29至隔日00:59每5分鐘輕量巡檢；落後即觸發完整自修。
    # 加密觸發可降低雲端排程偶發延遲造成三十分鐘期限失守的風險。
    - cron: '29,34,39,44,49,54,59 12 * * 1-6'
    - cron: '4,9,14,19,24,29,34,39,44,49,54,59 13-16 * * 1-6'
    - cron: '0 23 * * 1-6'
    # 全天每小時獨立巡檢；即使主排程沒有啟動，也能偵測公開頁與官方期別差異。
    - cron: '17 * * * *'
  workflow_dispatch: {}
permissions:
  contents: read
  actions: write
  issues: write
jobs:
  verify-and-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: tw539-watchdog
      # 新巡檢接手舊巡檢；已觸發的主更新在另一個雲端工作中繼續執行，避免故障時堆積整天的等待佇列。
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: 主流程失敗強制修復
        id: upstream_failure
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
        continue-on-error: true
        run: exit 1
      - name: 立即比較官方與手機公開頁
        id: fast_check
        continue-on-error: true
        timeout-minutes: 4
        env:
          TW539_WATCHDOG_FAST: 1
        run: python watchdog.py
      - name: 完整穩定性巡檢
        id: full_check
        # 五分鐘排程只做快速期別比對；主流程完成後與整點巡檢才做完整深掃。
        if: steps.fast_check.outcome == 'success' && (github.event_name != 'schedule' || github.event.schedule == '17 * * * *')
        continue-on-error: true
        timeout-minutes: 4
        run: python watchdog.py
      - name: 落後時自動重跑主流程
        if: steps.upstream_failure.outcome == 'failure' || steps.fast_check.outcome == 'failure' || steps.full_check.outcome == 'failure'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active=$(gh run list --repo "${{ github.repository }}" --workflow auto-update.yml --limit 20 --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length')
          if [ "$active" != "0" ]; then
            echo "主更新已在執行或排隊，不重複觸發"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            gh workflow run auto-update.yml --repo "${{ github.repository }}" --ref master -f repair=true && exit 0
            sleep $((attempt * 3))
          done
          exit 1
      - name: 修復後再次驗證
        id: repair_freshness
        if: steps.upstream_failure.outcome == 'failure' || steps.fast_check.outcome == 'failure' || steps.full_check.outcome == 'failure'
        timeout-minutes: 18
        env:
          TW539_WATCHDOG_FAST: 1
        run: |
          for i in {1..180}; do
            python watchdog.py && exit 0
            sleep 5
          done
          exit 1
      - name: 修復後完整內容驗收
        if: (steps.upstream_failure.outcome == 'failure' || steps.fast_check.outcome == 'failure' || steps.full_check.outcome == 'failure') && steps.repair_freshness.outcome == 'success'
        timeout-minutes: 4
        run: python watchdog.py
      - name: 修復失敗建立告警
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "${{ github.repository }}" --title "鐵律告警：手機公開頁仍落後官方 ${{ github.run_id }}" --body "看門狗自動重跑後仍未同步。請立即檢查：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
